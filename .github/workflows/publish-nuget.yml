name: Publish NuGet package

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Auth to GitHub Packages
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name "github" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet pack -c Release --no-build -o artifacts
      - name: Push nupkgs (skip duplicates)
        shell: bash
        run: |
          shopt -s nullglob
          for f in artifacts/*.nupkg; do
            dotnet nuget push "$f" --source "github" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
          done